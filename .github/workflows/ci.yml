name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vaultx
          POSTGRES_PASSWORD: vaultx
          POSTGRES_DB: vaultx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultx" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      VAULTX_TEST_DATABASE_URL: postgresql+psycopg://vaultx:vaultx@localhost:5432/vaultx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Migraties up/down/up en schema-drift
        env:
          VAULTX_DATABASE_URL: postgresql+psycopg://vaultx:vaultx@localhost:5432/vaultx_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - run: pytest -q

  npm-e2e:
    # NPM-connector tegen een echte Nginx Proxy Manager (zie e2e/README.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - name: Nginx Proxy Manager starten
        run: |
          docker run -d --name npm -p 81:81 -v npmdata:/data -v npmle:/etc/letsencrypt \
            docker.io/jc21/nginx-proxy-manager:2.16.0
          for i in $(seq 1 60); do curl -sf http://localhost:81/api/ && break; sleep 3; done
      - name: Seed en detectie controleren
        working-directory: backend
        run: python ../e2e/npm_e2e.py http://localhost:81 ci@example.com ci-npm-password-123

  bitwarden-e2e:
    # Officiële Bitwarden CLI tegen de VaultX-backend (zie e2e/README.md)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vaultx
          POSTGRES_PASSWORD: vaultx
          POSTGRES_DB: vaultx_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultx" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements-dev.txt
      # Vaste versie: een nieuwe clientversie wordt bewust getest voor ze hier komt.
      - run: npm install -g @bitwarden/cli@2026.9.1
      - name: Login, sync en items met bw
        working-directory: backend
        env:
          VAULTX_DATABASE_URL: postgresql+psycopg://vaultx:vaultx@localhost:5432/vaultx_e2e
        run: python ../e2e/bitwarden_e2e.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/backend.Dockerfile -t vaultx-backend:ci .
      - run: docker build -f docker/frontend.Dockerfile -t vaultx-web:ci .
