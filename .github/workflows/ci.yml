name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vaultx
          POSTGRES_PASSWORD: vaultx
          POSTGRES_DB: vaultx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultx" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      VAULTX_TEST_DATABASE_URL: postgresql+psycopg://vaultx:vaultx@localhost:5432/vaultx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Migraties up/down/up en schema-drift
        env:
          VAULTX_DATABASE_URL: postgresql+psycopg://vaultx:vaultx@localhost:5432/vaultx_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - run: pytest -q

  npm-e2e:
    # NPM-connector tegen een echte Nginx Proxy Manager (zie e2e/README.md)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vaultx
          POSTGRES_PASSWORD: vaultx
          POSTGRES_DB: vaultx_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultx" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Nginx Proxy Manager starten
        run: |
          docker run -d --name npm -p 81:81 -p 8080:80 -p 8443:443 \
            -v npmdata:/data -v npmle:/etc/letsencrypt \
            docker.io/jc21/nginx-proxy-manager:2.16.0
          for i in $(seq 1 60); do curl -sf http://localhost:81/api/ && break; sleep 3; done
      - name: Seed en detectie controleren
        working-directory: backend
        run: python ../e2e/npm_e2e.py http://localhost:81 ci@example.com ci-npm-password-123
      - name: Authentik-bescherming zetten, controleren en terugzetten
        working-directory: backend
        env:
          VAULTX_DATABASE_URL: postgresql+psycopg://vaultx:vaultx@localhost:5432/vaultx_e2e
        run: |
          python ../e2e/npm_write_e2e.py http://localhost:81 ci@example.com ci-npm-password-123 \
            --proxy 127.0.0.1 --http-port 8080 --https-port 8443
      - name: NPM-log bij een fout
        if: failure()
        run: docker logs npm 2>&1 | tail -100

  authentik-e2e:
    # Fase 4: VaultX maakt de Authentik-kant zelf aan, tegen echte Authentik en NPM (zie e2e/README.md)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vaultx
          POSTGRES_PASSWORD: vaultx
          POSTGRES_DB: vaultx_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultx" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AK_TOKEN: ci-authentik-bootstrap-token-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Authentik en NPM starten
        run: |
          docker network create ak
          docker run -d --name ak-db --network ak -e POSTGRES_DB=authentik -e POSTGRES_USER=authentik \
            -e POSTGRES_PASSWORD=authentik postgres:18-alpine
          cat > ak.env <<EOF
          AUTHENTIK_SECRET_KEY=ci-only-authentik-secret-key-0123456789abcdef
          AUTHENTIK_POSTGRESQL__HOST=ak-db
          AUTHENTIK_POSTGRESQL__USER=authentik
          AUTHENTIK_POSTGRESQL__NAME=authentik
          AUTHENTIK_POSTGRESQL__PASSWORD=authentik
          AUTHENTIK_BOOTSTRAP_PASSWORD=ci-akadmin-password
          AUTHENTIK_BOOTSTRAP_TOKEN=$AK_TOKEN
          AUTHENTIK_BOOTSTRAP_EMAIL=admin@example.com
          AUTHENTIK_ERROR_REPORTING__ENABLED=false
          AUTHENTIK_DISABLE_UPDATE_CHECK=true
          AUTHENTIK_LISTEN__HTTP=0.0.0.0:9000
          AUTHENTIK_LISTEN__HTTPS=0.0.0.0:9443
          AUTHENTIK_LISTEN__METRICS=0.0.0.0:9300
          EOF
          sed -i 's/^ *//' ak.env
          docker run -d --name ak-server --network ak -p 9000:9000 --env-file ak.env \
            docker.io/authentik/server:2026.8.3 server
          docker run -d --name ak-worker --network ak --env-file ak.env docker.io/authentik/server:2026.8.3 worker
          docker run -d --name npm -p 81:81 -p 80:80 -v npmdata:/data -v npmle:/etc/letsencrypt \
            docker.io/jc21/nginx-proxy-manager:2.16.0
          for i in $(seq 1 60); do curl -sf http://localhost:81/api/ && break; sleep 3; done
          for i in $(seq 1 100); do curl -sf http://localhost:9000/-/health/ready/ && break; sleep 3; done
      - name: NPM-gebruiker aanmaken
        working-directory: backend
        run: python ../e2e/npm_e2e.py http://localhost:81 ci@example.com ci-npm-password-123 --seed-only
      - name: Beschermen met Authentik in één stap, aanmelden in de browser, terugdraaien
        working-directory: backend
        env:
          VAULTX_DATABASE_URL: postgresql+psycopg://vaultx:vaultx@localhost:5432/vaultx_e2e
        run: |
          python ../e2e/authentik_npm_e2e.py http://localhost:81 ci@example.com ci-npm-password-123 \
            --authentik http://localhost:9000 --authentik-token $AK_TOKEN --browser
      - name: Logs bij een fout
        if: failure()
        run: |
          docker logs ak-server 2>&1 | tail -60
          docker logs ak-worker 2>&1 | tail -30
          docker logs npm 2>&1 | tail -40

  bitwarden-e2e:
    # Officiële Bitwarden CLI tegen de VaultX-backend (zie e2e/README.md)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vaultx
          POSTGRES_PASSWORD: vaultx
          POSTGRES_DB: vaultx_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultx" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements-dev.txt
      # Vaste versie: een nieuwe clientversie wordt bewust getest voor ze hier komt.
      - run: npm install -g @bitwarden/cli@2026.9.1
      - name: Login, sync en items met bw
        working-directory: backend
        env:
          VAULTX_DATABASE_URL: postgresql+psycopg://vaultx:vaultx@localhost:5432/vaultx_e2e
        run: python ../e2e/bitwarden_e2e.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/backend.Dockerfile -t vaultx-backend:ci .
      - run: docker build -f docker/frontend.Dockerfile -t vaultx-web:ci .
