# /etc/vaultx/nginx-realip.conf: welke reverse proxy het echte client-IP mag doorgeven
# (X-Forwarded-For). update.sh maakt dit bestand eenmalig aan en overschrijft het daarna nooit.
#
# Standaard: elk privé-adres, zodat het meteen werkt achter Nginx Proxy Manager. Veiliger:
# vervang de drie regels door enkel het IP van je NPM-host, bv.
#   set_real_ip_from 192.168.10.244;
# en herlaad: nginx -t && systemctl reload nginx
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
