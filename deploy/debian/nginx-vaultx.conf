# /etc/nginx/sites-available/vaultx
# Lokale nginx in de Debian-container. Nginx Proxy Manager zet hier TLS voor
# (Forward Hostname = IP van deze container, poort 80, "Websockets" mag uit).

server {
    listen 80;
    server_name vaultx.local;
    server_tokens off;
    client_max_body_size 1m;

    # Echte client-IP overnemen van NPM. Beperk tot het IP van je NPM-host.
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location ~ ^/(api|auth|health|identity)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location /assets/ {
        root /opt/vaultx/frontend/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /opt/vaultx/frontend/dist;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
}
