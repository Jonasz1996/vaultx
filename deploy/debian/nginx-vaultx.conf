# /etc/nginx/sites-available/vaultx
# Lokale nginx in de Debian-container. Nginx Proxy Manager zet hier TLS voor
# (Forward Hostname = IP van deze container, poort 80, "Websockets Support" aan voor live sync).

# NPM zet X-Forwarded-Proto; zonder proxy ervoor valt het terug op het eigen schema.
map $http_x_forwarded_proto $vaultx_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# WebSocket-upgrade voor de notificatie-hub (live sync); gewone requests houden keepalive.
map $http_upgrade $vaultx_connection {
    default upgrade;
    ""      "";
}

# Login-endpoints (Authentik-callback, Bitwarden /identity) per client-IP afremmen: elke
# Bitwarden-login kost de server een PBKDF2-berekening en een auditregel.
limit_req_zone $binary_remote_addr zone=vaultx_login:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name vaultx.local;
    server_tokens off;
    client_max_body_size 1m;

    # Echte client-IP overnemen van NPM. Beperk dit tot het IP van je NPM-host: elk adres hier
    # kan anders een vals X-Forwarded-For sturen (en zo een vals IP in de auditlog zetten).
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Notities en hun bijlagen (fase 7): grotere uploads dan de rest van de API. Hou dit
    # minstens VAULTX_VAULT_NOTE_FILE_MAX_MB (standaard 25) plus wat marge.
    location ~ ^/api/v1/me/notes(/|$) {
        client_max_body_size 30m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $vaultx_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # Links importeren (fase 10): een Linkwarden-export of bladwijzerbestand kan groot zijn.
    location = /api/v1/links/import {
        client_max_body_size 50m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $vaultx_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # Bitwarden-apps (fase 9): import van een volledige kluis en bijlagen bij items. Hou dit minstens
    # VAULTX_VAULT_ATTACHMENT_MAX_MB (standaard 100) plus wat marge.
    location ~ ^/api/ciphers/(import$|[^/]+/attachment) {
        client_max_body_size 110m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $vaultx_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/(auth|identity)(/|$) {
        limit_req zone=vaultx_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $vaultx_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/(api|health|icons)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $vaultx_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # Live sync voor de Bitwarden-apps (fase 9): een WebSocket per app naar de notificatie-hub.
    # VaultX pingt elke 15 s, dus de timeouts sluiten enkel echt dode verbindingen. Geen access
    # log: de apps zetten hun access token in de URL (?access_token=...).
    location /notifications/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vaultx_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $vaultx_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /assets/ {
        root /opt/vaultx/frontend/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        root /opt/vaultx/frontend/dist;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
}
