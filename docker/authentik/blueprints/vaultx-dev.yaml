# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# VaultX ontwikkelconfiguratie voor Authentik. Toont exact welke provider-
# instellingen VaultX verwacht; neem ze over in je eigen Authentik.
version: 1
metadata:
  name: VaultX - development
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # --- Groepen -------------------------------------------------------------
  - model: authentik_core.group
    id: grp-admins
    identifiers: {name: vaultx-admins}
  - model: authentik_core.group
    id: grp-demo-admin
    identifiers: {name: "vaultx:demo:admin"}
  - model: authentik_core.group
    id: grp-demo
    identifiers: {name: "vaultx:demo"}
  - model: authentik_core.group
    id: grp-demo-ops
    identifiers: {name: "vaultx:demo/ops"}

  # --- Testgebruikers ------------------------------------------------------
  - model: authentik_core.user
    identifiers: {username: alice}
    attrs:
      name: Alice Admin
      email: alice@vaultx.local
      password: alice-dev-password
      groups: [!KeyOf grp-admins, !KeyOf grp-demo-admin]
  - model: authentik_core.user
    identifiers: {username: bob}
    attrs:
      name: Bob Lid
      email: bob@vaultx.local
      password: bob-dev-password
      groups: [!KeyOf grp-demo, !KeyOf grp-demo-ops]

  # --- OIDC-provider -------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers: {name: VaultX}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Sinds Authentik 2026.x verplicht: toegelaten grant types per provider
      grant_types: [authorization_code]
      client_id: vaultx-dev
      client_secret: vaultx-dev-client-secret-0123456789
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/auth/callback", !Env [VAULTX_PUBLIC_URL, "http://localhost:8080"]]
        - matching_mode: strict
          url: !Format ["%s/login?logged_out=1", !Env [VAULTX_PUBLIC_URL, "http://localhost:8080"]]
          redirect_uri_type: logout
      logout_method: backchannel
      logout_uri: !Env [VAULTX_BACKCHANNEL_URL, "http://host.docker.internal:8000/auth/backchannel-logout"]
      # Verplicht voor VaultX: asymmetrische handtekening (RS256) i.p.v. HS256
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_token_validity: minutes=10
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers: {slug: vaultx}
    attrs:
      name: VaultX
      provider: !KeyOf provider
      meta_launch_url: !Env [VAULTX_PUBLIC_URL, "http://localhost:8080"]
