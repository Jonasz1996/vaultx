[project]
name = "vaultx-backend"
version = "0.7.0"
description = "VaultX backend: Authentik/OIDC, multi-tenancy, audit, NPM-connector, applicatiecatalogus en kluis voor Bitwarden-clients"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["B008", "S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
